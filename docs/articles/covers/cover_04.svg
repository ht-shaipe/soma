  <text x="80" y="238" font-family="'PingFang SC',sans-serif" font-size="30" font-weight="600" fill="#B98CFF" letter-spacing="6">CosyVoice · 声音克隆引擎</text>

  <text x="78" y="334" font-family="'PingFang SC',sans-serif" font-size="84" font-weight="700" fill="#F4F8FF">声音克隆 TTS</text>
  <text x="78" y="436" font-family="'PingFang SC',sans-serif" font-size="84" font-weight="700" fill="#F4F8FF">集成踩坑记</text>

  <rect x="80" y="478" width="120" height="6" rx="3" fill="url(#accent)"/>

  <text x="80" y="540" font-family="'PingFang SC',sans-serif" font-size="30" fill="#B9C9E2">多格式统一 24kHz；参考音频路径三种情况解析</text>

  <g font-family="'PingFang SC',sans-serif" font-size="22" fill="#E3D8F5">
    <rect x="80" y="586" width="175" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.06" stroke="#B98CFF" stroke-opacity="0.35"/>
    <text x="167" y="617" text-anchor="middle">CosyVoice2</text>
    <rect x="275" y="586" width="125" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.06" stroke="#B98CFF" stroke-opacity="0.35"/>
