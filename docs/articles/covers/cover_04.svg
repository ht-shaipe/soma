      <rect x="86"  y="384" width="12" height="32" rx="6" opacity="0.55"/>
      <rect x="114" y="375" width="12" height="50" rx="6" opacity="0.9"/>
      <rect x="142" y="366" width="12" height="68" rx="6" opacity="0.55"/>
      <rect x="170" y="378" width="12" height="44" rx="6" opacity="0.9"/>
      <rect x="198" y="358" width="12" height="84" rx="6" opacity="0.55"/>
      <rect x="226" y="371" width="12" height="58" rx="6" opacity="0.9"/>
      <rect x="254" y="386" width="12" height="28" rx="6" opacity="0.55"/>
      <rect x="282" y="364" width="12" height="72" rx="6" opacity="0.9"/>
      <rect x="310" y="352" width="12" height="96" rx="6" opacity="0.55"/>
      <rect x="338" y="374" width="12" height="52" rx="6" opacity="0.9"/>
      <rect x="366" y="382" width="12" height="36" rx="6" opacity="0.55"/>
