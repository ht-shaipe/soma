    <line x1="230" y1="518" x2="230" y2="548" stroke="#B98CFF" stroke-width="3"/>
    <polygon points="0,0 -9,-14 9,-14" transform="translate(230,558)" fill="#B98CFF"/>

    <rect x="80" y="566" width="300" height="44" rx="22" fill="#35D0A5" fill-opacity="0.1" stroke="#35D0A5" stroke-opacity="0.6" stroke-width="2"/>
    <text x="230" y="595" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="20" fill="#7BE3C6">统一 24kHz · mono · WAV</text>
