    <rect x="420" y="586" width="175" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.06" stroke="#B98CFF" stroke-opacity="0.35"/>
    <text x="507" y="617" text-anchor="middle">24kHz mono</text>
    <rect x="615" y="586" width="130" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.06" stroke="#B98CFF" stroke-opacity="0.35"/>
