[package]
name = "soma-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Soma HTTP server and pipeline orchestrator"

[[bin]]
name = "soma"
path = "src/main.rs"

[dependencies]
soma-core = { workspace = true }
soma-tts = { workspace = true }
soma-stock = { workspace = true }
soma-video = { workspace = true }

ai-llm-kit = { workspace = true }

actix-web = { workspace = true }
actix-cors = { workspace = true }
actix-files = { workspace = true }
actix-multipart = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
futures = { workspace = true }
lazy_static = { workspace = true }
tokio = { workspace = true }
rand = { workspace = true }
regex = "1"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
percent-encoding = "2"
reqwest = { version = "0.12", features = ["json", "multipart"] }
redis = { version = "0.27", features = ["tokio-comp"], optional = true }

tube = { workspace = true }
tube_web = { workspace = true }
tube_net = { workspace = true }
tube_value = { workspace = true }

[features]
default = []
redis = ["dep:redis"]
